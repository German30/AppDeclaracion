<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="shell__brand">
      <span class="shell__brand-mark"><app-icon name="calculator" [size]="16" /></span>
      Declaración Anual
    </a>

    <div class="shell__user">
      @if (sesion(); as s) {
        <span class="shell__email">{{ s.email }}</span>
      }
      <button type="button" class="shell__logout" (click)="cerrarSesion()">
        <app-icon name="log-out" [size]="15" />
        Salir
      </button>
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
