<div class="field" [class.field--error]="errorText() && touched()" [class.field--disabled]="disabled()">
  @if (label()) {
    <label [for]="id" class="field__label">{{ label() }}</label>
  }
  <div class="field__control field__control--select">
    <select
      [id]="id"
      [disabled]="disabled()"
      [value]="value()"
      (change)="handleChange($any($event.target).value)"
      (blur)="handleBlur()"
      [attr.aria-invalid]="errorText() && touched() ? 'true' : null"
    >
      @if (!value()) {
        <option value="" disabled selected>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
  @if (errorText() && touched()) {
    <p class="field__hint field__hint--error">{{ errorText() }}</p>
  } @else if (helper()) {
    <p class="field__hint">{{ helper() }}</p>
  }
</div>
